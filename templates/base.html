<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FluentFling{% endblock %}</title>
  <link rel="icon" href="/static/images/logo.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/static/css/style.css?v=9">
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="/">
        <img src="/static/images/logo.png" alt="FluentFling logo">
        <span class="brand-text">FluentFling</span>
      </a>
      <div class="navbar-nav ms-auto d-flex flex-row gap-2">
        <a class="nav-link nav-pill" href="/flashcards"><i class="bi bi-stack"></i> Flashcards</a>
        <a class="nav-link nav-pill" href="/test"><i class="bi bi-pencil-square"></i> Test</a>
        <a class="nav-link nav-pill position-relative" href="/bookmarks">
          <i class="bi bi-bookmark-heart"></i> Bookmarks
          <span id="bm-count-badge" class="bm-badge" style="display:none"></span>
        </a>
        <a class="nav-link nav-pill" href="/upload"><i class="bi bi-cloud-upload"></i> Import</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    {% block content %}{% endblock %}
  </main>
  {% block modals %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.querySelectorAll('.nav-pill').forEach(a => {
      if (location.pathname.startsWith(new URL(a.href).pathname)) a.classList.add('active');
    });
    // Bookmark badge count (shared across all pages)
    (function() {
      try {
        const bm = JSON.parse(localStorage.getItem('ff_bookmarks') || '[]');
        const badge = document.getElementById('bm-count-badge');
        if (badge && bm.length) {
          badge.textContent  = bm.length;
          badge.style.display = 'inline-flex';
        }
      } catch {}
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
